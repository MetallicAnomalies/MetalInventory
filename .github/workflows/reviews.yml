name: Daily Metal Reviews

on:
  schedule:
    # Runs at 7:00 AM UTC every day
    - cron: '0 7 * * *'
  workflow_dispatch: # Manual trigger button

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # We need feedparser for this script
          pip install cloudscraper feedparser beautifulsoup4

      - name: 4. Run Review Fetcher
        run: python scripts/rss_reviews.py

      - name: 5. Commit and Push Results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          git add metal_reviews.json
          
          if git diff --staged --quiet; then
            echo "No new reviews found today."
          else
            git commit -m "Update reviews: $(date +'%Y-%m-%d')"
            git push
          fi
